cognitive:
  enabled: true
  providers:
  - name: custom
    base_url: http://127.0.0.1:8085
    api_key: ''
    api_key_env: ''
    timeout_ms: 30000
    enabled: true
  context_budget:
    slm_max_tokens: 8192
    llm_max_tokens: 32768
    reserved_system_tokens: 512
  reasoning:
    default_max_tokens: 2048
    default_temperature: 0.7
    critical_timeout_ms: 30000
    high_timeout_ms: 15000
    medium_timeout_ms: 10000
    low_timeout_ms: 5000
  systems:
    chat:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    sleep:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    reasoning:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    reactions:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    doctor:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    research:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    tasks:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
    immune:
      provider: custom
      model: Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
  default_fallback_chain:
  - provider: ollama
    model: bonsai-8b
  - provider: ollama
    model: llama3.2
  fallback_cortisol:
    release_per_step: 0.1
    escalation_after: 5
