[package]
name = "openbad-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "openbad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["keyring"]
keyring = ["openbad-governance/keyring"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
directories = { workspace = true }
ignore = "0.4"
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
openbad-core = { path = "../../../crates/openbad-core" }
openbad-store = { path = "../../../crates/openbad-store" }
openbad-agent = { path = "../../../crates/openbad-agent" }
openbad-harness = { path = "../../../crates/openbad-harness" }
openbad-llm = { path = "../../../crates/openbad-llm" }
openbad-tools = { path = "../../../crates/openbad-tools" }
openbad-lsp = { path = "../../../crates/openbad-lsp" }
openbad-mcp = { path = "../../../crates/openbad-mcp" }
openbad-terminal = { path = "../../../crates/openbad-terminal" }
openbad-workspace = { path = "../../../crates/openbad-workspace" }
openbad-index = { path = "../../../crates/openbad-index" }
openbad-governance = { path = "../../../crates/openbad-governance" }
similar = "2"
base64 = "0.22"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
