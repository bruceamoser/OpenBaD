[package]
name = "openbad-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
openbad-core = { path = "../openbad-core" }
openbad-governance = { path = "../openbad-governance" }
openbad-workspace = { path = "../openbad-workspace" }
async-trait = "0.1"
blake3 = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
wait-timeout = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
