name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: ""
            bundles: "appimage,deb"
          - platform: macos-universal
            os: macos-14
            args: "--target universal-apple-darwin"
            bundles: "dmg"
          - platform: windows-x86_64
            os: windows-latest
            args: ""
            bundles: "msi,nsis"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir apps/desktop/ui install --frozen-lockfile

      - name: Build UI
        run: pnpm --dir apps/desktop/ui build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Build bundles
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-universal' && '-' || '' }}
        run: >
          node ui/node_modules/@tauri-apps/cli/tauri.js build
          ${{ matrix.args }}
          --bundles ${{ matrix.bundles }}
          --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect bundles
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*.exe' \) -print0 \
            | while IFS= read -r -d '' file; do
                name="$(basename "$file")"
                normalized="${name// /_}"
                cp "$file" "release-assets/$normalized"
              done
          ls -l release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release-assets/* \
              --title "OpenBaD $TAG" \
              --generate-notes \
              --latest
          fi
