name: Bundles

# The expensive part of a release: three full release-profile builds plus
# bundling. It runs off the critical path — on the commit that bumps the
# version, and on demand — so tagging only has to publish the artifacts.
#
# GitHub scopes caches to the ref they were created on, so a build on a tag can
# never reuse a cache saved on main. Keeping the build here (a branch ref) is
# what makes the rebuild cheap on a second run, and what keeps the tag job short.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/bundles.yml

permissions:
  contents: read

concurrency:
  # Never cancel: a release tag points at a specific commit, and a cancelled run
  # for that commit would leave the tag with nothing to publish.
  group: bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            args: ""
            bundles: "appimage,deb"
          - platform: macos-universal
            os: macos-14
            args: "--target universal-apple-darwin"
            bundles: "dmg"
          - platform: windows-x86_64
            os: windows-latest
            args: ""
            bundles: "msi,nsis"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir apps/desktop/ui install --frozen-lockfile

      - name: Build UI
        run: pnpm --dir apps/desktop/ui build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Caches the release-profile artifacts too. GitHub scopes a cache to the
      # ref that saved it, so this only helps runs on a branch — never a tag,
      # which is exactly why the build lives here and not in the release job.
      - uses: Swatinem/rust-cache@v2

      - name: Build bundles
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-universal' && '-' || '' }}
        run: >
          node ui/node_modules/@tauri-apps/cli/tauri.js build
          ${{ matrix.args }}
          --bundles ${{ matrix.bundles }}
          --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
