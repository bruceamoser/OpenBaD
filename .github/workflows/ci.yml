name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never reads debug info, and emitting it dominates the link step of the
  # Tauri binary and of every test executable.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # Cheap, no system dependencies and no compilation: fails fast on formatting
  # and repository scripts while the Rust jobs spin up.
  checks:
    name: Formatting and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Documentation links
        run: python3 scripts/check_docs.py

      - name: Theme tokens
        run: python3 scripts/check_theme_tokens.py

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the apt archive cache
        run: sudo chown -R "$USER" /var/cache/apt/archives

      - name: Restore cached apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xvfb

      - name: Install the WebKit web driver
        run: |
          sudo apt-get install -y webkit2gtk-driver || sudo apt-get install -y webkitgtk-webdriver

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      # The desktop crate embeds the UI bundle at compile time, so it has to
      # exist before anything builds.
      - name: Build the UI
        working-directory: apps/desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the apt archive cache
        run: sudo chown -R "$USER" /var/cache/apt/archives

      - name: Restore cached apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Typecheck and build the UI
        working-directory: apps/desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

  e2e:
    name: Native end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the apt archive cache
        run: sudo chown -R "$USER" /var/cache/apt/archives

      - name: Restore cached apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xvfb

      - name: Install the WebKit web driver
        run: |
          sudo apt-get install -y webkit2gtk-driver || sudo apt-get install -y webkitgtk-webdriver

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Build the UI
        working-directory: apps/desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build native test binary
        working-directory: apps/desktop
        run: ./ui/node_modules/.bin/tauri build --no-bundle --debug --config '{"build":{"beforeBuildCommand":""}}'

      - name: Native Tauri end-to-end tests
        working-directory: apps/desktop/native-e2e
        env:
          OPENBAD_APP_BINARY: ${{ github.workspace }}/target/debug/openbad-desktop
        run: |
          export WEBKIT_WEBDRIVER_BIN="$(command -v WebKitWebDriver)"
          xvfb-run -a npm test
