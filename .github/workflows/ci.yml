name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xvfb
          if ! sudo apt-get install -y webkit2gtk-driver; then
            sudo apt-get install -y webkitgtk-webdriver
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install and build the UI
        working-directory: apps/desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build native test binary
        working-directory: apps/desktop
        run: ./ui/node_modules/.bin/tauri build --no-bundle --debug --config '{"build":{"beforeBuildCommand":""}}'

      - name: Native Tauri end-to-end tests
        working-directory: apps/desktop/native-e2e
        env:
          OPENBAD_APP_BINARY: ${{ github.workspace }}/target/debug/openbad-desktop
        run: |
          export WEBKIT_WEBDRIVER_BIN="$(command -v WebKitWebDriver)"
          xvfb-run -a npm test

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Documentation links
        run: python3 scripts/check_docs.py
