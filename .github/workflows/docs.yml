name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "archive/**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "archive/**/*.md"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation links and fences
        run: python scripts/check_docs.py
